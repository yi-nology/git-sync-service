name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run tests
        run: go test -v ./...

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install cross-compilation tools (Linux CGO)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          binary_name="git-sync-service"
          if [ "$GOOS" = "windows" ]; then
            binary_name="${binary_name}.exe"
            if [ "$GOARCH" = "amd64" ]; then
              export CC=x86_64-w64-mingw32-gcc
            fi
          fi
          if [ "$GOOS" = "darwin" ]; then
            # macOS CGO cross-compilation requires osxcross; disable CGO for darwin cross-builds
            export CGO_ENABLED=0
          fi
          go build -o "./dist/${binary_name}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-sync-service-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./dist/*

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG="Initial release"
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}
            
            ## Artifacts
            - `git-sync-service-linux-amd64` - Linux x86_64
            - `git-sync-service-linux-arm64` - Linux ARM64
            - `git-sync-service-darwin-amd64` - macOS x86_64
            - `git-sync-service-darwin-arm64` - macOS ARM64 (Apple Silicon)
            - `git-sync-service-windows-amd64.exe` - Windows x86_64
            - `git-sync-service-windows-arm64.exe` - Windows ARM64
          files: ./artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
